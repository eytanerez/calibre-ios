name: Rewatch
options:
  bundleIdPrefix: com.shoprewatch
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  RewatchKit:
    path: Packages/RewatchKit
  RewatchDesign:
    path: Packages/RewatchDesign
  StripeiOS:
    url: https://github.com/stripe/stripe-ios
    exactVersion: 26.2.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.0.6
  # Product analytics. App target only — RewatchKit stays dependency-free, so
  # the seam that wraps this lives in Rewatch/App/Analytics.swift.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.69.6
  # Crash/error reporting. App target only, like PostHog, and wired from
  # Rewatch/App/Observability.swift. Pinned to the same sentry-cocoa version
  # the admin app pins (admin-ios/project.yml) so one Sentry project sees one
  # SDK version across every ReWatch client.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 8.58.4

configFiles:
  Debug: Rewatch/Config/Debug.xcconfig
  Release: Rewatch/Config/Release.xcconfig

targets:
  Rewatch:
    type: application
    platform: iOS
    sources:
      - path: Rewatch
    dependencies:
      - package: RewatchKit
      - package: RewatchDesign
      - package: StripeiOS
        products:
          # PaymentSheet still drives offer holds and label purchases.
          - StripePaymentSheet
          # Buyer card checkout needs the card field + the payment handler
          # directly, so the card's funding is known before we confirm.
          - StripePaymentsUI
          - StripeConnect
      - package: Nuke
        products:
          - Nuke
          - NukeUI
      - package: PostHog
        products:
          - PostHog
      - package: Sentry
    # Sends this build's debug symbols (dSYMs) to Sentry, so a crash report
    # names our functions and lines instead of `<redacted>` addresses. Only
    # when archiving (ACTION=install): a debug build has no dSYM worth
    # sending. Never fails the build: without sentry-cli or a token in
    # ~/.sentryclirc it warns and moves on. Symbols only; no source is sent.
    postBuildScripts:
      - name: Upload dSYMs to Sentry
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
        script: |
          [ "$ACTION" = "install" ] || exit 0
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v sentry-cli >/dev/null; then
            echo "warning: sentry-cli is not installed; this build's dSYMs did not reach Sentry"
            exit 0
          fi
          if ! sentry-cli debug-files upload --org calibre-q0 --project calibre-ios "$DWARF_DSYM_FOLDER_PATH"; then
            echo "warning: sentry-cli could not upload this build's dSYMs to Sentry"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shoprewatch.rewatch
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 6
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        CODE_SIGN_ENTITLEMENTS: Rewatch/Config/Rewatch.entitlements
        # Off so the dSYM upload in postBuildScripts can read ~/.sentryclirc;
        # it is the target's only script.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Rewatch/Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ReWatch
        # Portrait only. This used to be an `INFOPLIST_KEY_…` build setting,
        # which Xcode merges into a *generated* Info.plist and ignores
        # entirely when the target names its own `INFOPLIST_FILE` — as this
        # one does. `GENERATE_INFOPLIST_FILE` resolves to NO here, so the
        # setting was dropped in silence and the built app shipped with no
        # orientation key at all, which means every orientation. Declared in
        # the plist the target actually uses, it takes effect.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Clearing a notification on one device clears it on the others, and
        # the card already delivered to their trays has to go with it. That
        # arrives as a silent `content-available` push, which iOS will only
        # wake the app for if this is declared — without it the sync works
        # solely while the app is already open, which is when nobody needs it.
        # See PushCoordinator.ClearedSync.
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: ReWatch uses the camera to photograph watches you list for sale and, during seller verification, to capture identity documents.
        NSPhotoLibraryUsageDescription: ReWatch lets you choose existing photos of your watch when creating a listing.
        NSFaceIDUsageDescription: ReWatch uses Face ID to keep your vault private, so only you can see the watches you own.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - rewatch
        RewatchAPIBaseURL: $(API_BASE_URL)
        RewatchMessagingBaseURL: $(MESSAGING_API_BASE_URL)
        RewatchApplePayEnabled: $(APPLE_PAY_ENABLED)
        RewatchPostHogKey: $(REWATCH_POSTHOG_KEY)
        RewatchPostHogHost: $(REWATCH_POSTHOG_HOST)
        # Empty in both tracked xcconfigs. Observability.swift reads these and
        # starts nothing when the value is blank — see Config/Release.xcconfig.
        RewatchSentryDSN: $(REWATCH_SENTRY_DSN)
        RewatchBetterStackToken: $(REWATCH_BETTERSTACK_TOKEN)
        RewatchBetterStackHost: $(REWATCH_BETTERSTACK_HOST)
  RewatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RewatchUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rewatch

  # Unit tests for the app target's own models — the router and the checkout
  # machine live here rather than in RewatchKit, and until this target existed
  # neither could be tested at all: a UI test can only reach them through a
  # screen, and RewatchKit's tests cannot see them.
  RewatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RewatchTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rewatch

schemes:
  Rewatch:
    build:
      targets:
        Rewatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RewatchTests
        - RewatchUITests
        - package: RewatchKit/RewatchKitTests
        - package: RewatchDesign/RewatchDesignTests
    archive:
      config: Release
