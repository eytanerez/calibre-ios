name: Calibre
options:
  bundleIdPrefix: com.buycalibre
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  CalibreKit:
    path: Packages/CalibreKit
  CalibreDesign:
    path: Packages/CalibreDesign
  StripeiOS:
    url: https://github.com/stripe/stripe-ios
    exactVersion: 26.2.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.0.6
  # Product analytics. App target only — CalibreKit stays dependency-free, so
  # the seam that wraps this lives in Calibre/App/Analytics.swift.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.69.6

configFiles:
  Debug: Calibre/Config/Debug.xcconfig
  Release: Calibre/Config/Release.xcconfig

targets:
  Calibre:
    type: application
    platform: iOS
    sources:
      - path: Calibre
    dependencies:
      - package: CalibreKit
      - package: CalibreDesign
      - package: StripeiOS
        products:
          # PaymentSheet still drives offer holds and label purchases.
          - StripePaymentSheet
          # Buyer card checkout needs the card field + the payment handler
          # directly, so the card's funding is known before we confirm.
          - StripePaymentsUI
          - StripeConnect
      - package: Nuke
        products:
          - Nuke
          - NukeUI
      - package: PostHog
        products:
          - PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buycalibre.calibre
        MARKETING_VERSION: 1.0.23
        CURRENT_PROJECT_VERSION: 24
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        CODE_SIGN_ENTITLEMENTS: Calibre/Config/Calibre.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Calibre/Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Calibre
        # Portrait only. This used to be an `INFOPLIST_KEY_…` build setting,
        # which Xcode merges into a *generated* Info.plist and ignores
        # entirely when the target names its own `INFOPLIST_FILE` — as this
        # one does. `GENERATE_INFOPLIST_FILE` resolves to NO here, so the
        # setting was dropped in silence and the built app shipped with no
        # orientation key at all, which means every orientation. Declared in
        # the plist the target actually uses, it takes effect.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Calibre uses the camera to photograph watches you list for sale and, during seller verification, to capture identity documents.
        NSPhotoLibraryUsageDescription: Calibre lets you choose existing photos of your watch when creating a listing.
        NSFaceIDUsageDescription: Calibre uses Face ID to keep your vault private, so only you can see the watches you own.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - calibre
        CalibreAPIBaseURL: $(API_BASE_URL)
        CalibreMessagingBaseURL: $(MESSAGING_API_BASE_URL)
        CalibreApplePayEnabled: $(APPLE_PAY_ENABLED)
        CalibrePostHogKey: $(CALIBRE_POSTHOG_KEY)
        CalibrePostHogHost: $(CALIBRE_POSTHOG_HOST)
  CalibreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CalibreUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Calibre

schemes:
  Calibre:
    build:
      targets:
        Calibre: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CalibreUITests
        - package: CalibreKit/CalibreKitTests
        - package: CalibreDesign/CalibreDesignTests
    archive:
      config: Release
