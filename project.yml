name: Rewound
options:
  bundleIdPrefix: com.shoprewound
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  RewoundKit:
    path: Packages/RewoundKit
  RewoundDesign:
    path: Packages/RewoundDesign
  StripeiOS:
    url: https://github.com/stripe/stripe-ios
    exactVersion: 26.2.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.0.6
  # Product analytics. App target only — RewoundKit stays dependency-free, so
  # the seam that wraps this lives in Rewound/App/Analytics.swift.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.69.6
  # Crash/error reporting. App target only, like PostHog, and wired from
  # Rewound/App/Observability.swift. Pinned to the same sentry-cocoa version
  # the admin app pins (admin-ios/project.yml) so one Sentry project sees one
  # SDK version across every Rewound client.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 8.58.4

configFiles:
  Debug: Rewound/Config/Debug.xcconfig
  Release: Rewound/Config/Release.xcconfig

targets:
  Rewound:
    type: application
    platform: iOS
    sources:
      - path: Rewound
    dependencies:
      - package: RewoundKit
      - package: RewoundDesign
      - package: StripeiOS
        products:
          # PaymentSheet still drives offer holds and label purchases.
          - StripePaymentSheet
          # Buyer card checkout needs the card field + the payment handler
          # directly, so the card's funding is known before we confirm.
          - StripePaymentsUI
          - StripeConnect
      - package: Nuke
        products:
          - Nuke
          - NukeUI
      - package: PostHog
        products:
          - PostHog
      - package: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shoprewound.rewound
        MARKETING_VERSION: 1.0.23
        CURRENT_PROJECT_VERSION: 51
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        CODE_SIGN_ENTITLEMENTS: Rewound/Config/Rewound.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Rewound/Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Rewound
        # Portrait only. This used to be an `INFOPLIST_KEY_…` build setting,
        # which Xcode merges into a *generated* Info.plist and ignores
        # entirely when the target names its own `INFOPLIST_FILE` — as this
        # one does. `GENERATE_INFOPLIST_FILE` resolves to NO here, so the
        # setting was dropped in silence and the built app shipped with no
        # orientation key at all, which means every orientation. Declared in
        # the plist the target actually uses, it takes effect.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Clearing a notification on one device clears it on the others, and
        # the card already delivered to their trays has to go with it. That
        # arrives as a silent `content-available` push, which iOS will only
        # wake the app for if this is declared — without it the sync works
        # solely while the app is already open, which is when nobody needs it.
        # See PushCoordinator.ClearedSync.
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Rewound uses the camera to photograph watches you list for sale and, during seller verification, to capture identity documents.
        NSPhotoLibraryUsageDescription: Rewound lets you choose existing photos of your watch when creating a listing.
        NSFaceIDUsageDescription: Rewound uses Face ID to keep your vault private, so only you can see the watches you own.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - rewound
        RewoundAPIBaseURL: $(API_BASE_URL)
        RewoundMessagingBaseURL: $(MESSAGING_API_BASE_URL)
        RewoundApplePayEnabled: $(APPLE_PAY_ENABLED)
        RewoundPostHogKey: $(REWOUND_POSTHOG_KEY)
        RewoundPostHogHost: $(REWOUND_POSTHOG_HOST)
        # Empty in both tracked xcconfigs. Observability.swift reads these and
        # starts nothing when the value is blank — see Config/Release.xcconfig.
        RewoundSentryDSN: $(REWOUND_SENTRY_DSN)
        RewoundBetterStackToken: $(REWOUND_BETTERSTACK_TOKEN)
        RewoundBetterStackHost: $(REWOUND_BETTERSTACK_HOST)
  RewoundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RewoundUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rewound

  # Unit tests for the app target's own models — the router and the checkout
  # machine live here rather than in RewoundKit, and until this target existed
  # neither could be tested at all: a UI test can only reach them through a
  # screen, and RewoundKit's tests cannot see them.
  RewoundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RewoundTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rewound

schemes:
  Rewound:
    build:
      targets:
        Rewound: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RewoundTests
        - RewoundUITests
        - package: RewoundKit/RewoundKitTests
        - package: RewoundDesign/RewoundDesignTests
    archive:
      config: Release
